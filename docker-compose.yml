# PostgreSQL cho môi trường dev — cùng engine với production (Supabase Postgres).
# Port 5434: máy dev đã có Postgres Homebrew ở 5432 và PostgreSQL 18 (EDB installer) ở 5433.
services:
  postgres:
    image: postgres:16
    container_name: perfume-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: perfume
      POSTGRES_PASSWORD: perfume
      POSTGRES_DB: perfume_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfume -d perfume_shop"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
